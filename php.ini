expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

allow_url_fopen = Off
allow_url_include = Off
open_basedir = /var/www/html:/tmp
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,link,symlink,fsockopen,pfsockopen,stream_socket_client

file_uploads = On
upload_tmp_dir = /tmp
upload_max_filesize = 96K
post_max_size = 128K
max_file_uploads = 1
max_execution_time = 10
memory_limit = 64M

session.save_path = /tmp
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

date.timezone = Asia/Ho_Chi_Minh
